# Pacote da Central para Mac (Apple Silicon): roda num Mac do GitHub e anexa o .dmg ao release.
# Dispara sozinho quando um release é publicado, ou à mão (Actions → Build Mac → Run workflow) com a tag.
name: Build Mac

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do release (ex.: v0.49.0)'
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # sem certificado da Apple: o pacote sai sem assinatura (o macOS pede liberação na primeira abertura)
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar
        working-directory: app
        run: npm ci
      - name: Gerar o .dmg
        working-directory: app
        run: npm run dist:mac
      - name: Anexar ao release
        working-directory: app
        run: gh release upload "$TAG" release/Central-*.dmg --clobber
